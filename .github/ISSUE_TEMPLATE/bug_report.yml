name: Tap or install problem
description: brew install/upgrade fails, or the cask is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and its full output.
    validations:
      required: true
  - type: input
    id: brew
    attributes:
      label: Homebrew and macOS versions
      description: Output of `brew --version` and `sw_vers -productVersion`.
    validations:
      required: true
