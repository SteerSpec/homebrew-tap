name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          status=0
          check() {
            if ! printf '%s' "$1" | grep -Eq "$pattern"; then
              echo "::error::Not a Conventional Commit: $1"
              status=1
            fi
          }
          # The PR title becomes the squash-merge commit that release-please reads.
          check "$PR_TITLE"
          while IFS= read -r subject; do
            case "$subject" in Merge\ *) continue ;; esac
            check "$subject"
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          exit $status
